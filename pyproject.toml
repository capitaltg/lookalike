[project]
name = "lookalike"
version = "0.1.0"
description = "Anonymize structured data files with random fake values while preserving schema, types and uniqueness cardinality."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["faker>=20"]

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[project.scripts]
lookalike = "lookalike.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyarrow>=14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookalike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
