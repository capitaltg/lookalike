[project]
name = "lookalike"
version = "0.1.1"
description = "Anonymize structured data files with random fake values while preserving schema, types and uniqueness cardinality."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["faker>=20", "tomli>=2; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/capitaltg/lookalike"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[project.scripts]
lookalike = "lookalike.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyarrow>=14"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookalike"]

[tool.pytest.ini_options]
testpaths = ["tests"]
