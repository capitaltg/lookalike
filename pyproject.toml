[project]
name = "lookalike"
version = "0.1.3"
description = "Anonymize structured data files with random fake values while preserving schema, types and uniqueness cardinality."
dynamic = ["readme"]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["faker>=20", "tomli>=2; python_version < '3.11'"]

[project.urls]
Repository = "https://github.com/capitaltg/lookalike"

[project.optional-dependencies]
parquet = ["pyarrow>=14"]

[project.scripts]
lookalike = "lookalike.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pyarrow>=14"]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=23.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lookalike"]

# PyPI does not resolve relative links, so the README's links to docs/ and
# LICENSE are rewritten to point at this release's tag on GitHub.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/capitaltg/lookalike/blob/v$HFPR_VERSION/\1)'

[tool.pytest.ini_options]
testpaths = ["tests"]
